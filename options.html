<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snail Type - Options</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Options</h1>
            <a href="index.html" class="info-link">Back</a>
        </header>
        
        <main>
            <section class="stats-section options-compact">
                <div id="modes-table-container"></div>
                <div class="reset-row">
                    <button id="reset-options-btn" class="reset-small-btn">Reset options to default</button>
                </div>
            </section>

            <section class="stats-section options-compact">
                <h2 class="keymap-heading">Keyboard Layout</h2>
                <p class="section-hint">The physical position of each letter key. Used to understand which finger types what.</p>
                <div class="keymap-toolbar">
                    <button id="keymap-shape-btn" class="reset-small-btn" type="button"></button>
                </div>
                <div id="keymap-grid" class="keymap-grid"></div>
                <p id="keymap-warning" class="keymap-warning"></p>
                <div class="reset-row">
                    <button id="reset-keymap-btn" class="reset-small-btn">Reset keymap to default</button>
                </div>
            </section>

            <div class="options-footer">
                <a href="index.html" class="info-link">Back</a>
            </div>

            <pre id="debug-output" style="color: #888; font-size: 0.75rem; margin-top: 20px; white-space: pre-wrap; word-break: break-all;"></pre>
        </main>
    </div>
    
    <div id="toast" class="toast">Options saved!</div>
    
    <script type="module" src="options.js"></script>
</body>
</html>
